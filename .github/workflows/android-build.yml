name: Android APK Build

on:
  push:
    branches: [main, version-b]
  workflow_dispatch:

# MENOR PRIVILEGIO (S-6 da auditoria de suprimentos). Sem este bloco o job
# herda o default da ORGANIZACAO/CONTA, que ninguem daqui consegue ler — se o
# default for `write-all`, todo step deste workflow (incluindo o Gradle e as
# actions de terceiro abaixo) roda com um token que pode escrever na `main`,
# que e a branch que o Cloudflare publica sozinha.
# Este workflow so LE o repo, builda o APK e sobe artefato: `contents: read`
# basta. `actions/upload-artifact` NAO precisa de permissao de token — a API de
# artefato usa o `ACTIONS_RUNTIME_TOKEN`, que e outro.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ACOES PRESAS POR SHA (S-6). `android-actions/setup-android` e
      # `reactivecircus/android-emulator-runner` sao de TERCEIRO de verdade: sob
      # tag movel (`@v3`/`@v2`) o dono da action reaponta a tag e o codigo novo
      # roda no runner sem ninguem revisar nada. O SHA e imutavel.
      # O comentario com a versao ao lado de cada SHA e OBRIGATORIO — sem ele o
      # arquivo vira 40 caracteres opacos que ninguem ousa atualizar.
      # Como atualizar (o mesmo comando que gerou estes):
      #   curl -s https://api.github.com/repos/<owner>/<repo>/git/ref/tags/<tag>
      #   (se `object.type` for `tag`, dereferencie em /git/tags/<sha>)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # Mesmo problema do `ci.yml` (ver a justificativa longa lá): `class-system`
      # resolve por `git+ssh` (`package-lock.json:5502`) e o runner não tem
      # chave SSH — hoje passa só porque o repo irmão é PÚBLICO. Sem este step,
      # o APK para de buildar no dia em que ele virar privado.
      - name: Configurar acesso aos repos irmãos (sobrevive ao repo privado)
        env:
          SIBLING_REPOS_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN }}
        run: |
          if [ -n "$SIBLING_REPOS_TOKEN" ]; then
            git config --global --add url."https://x-access-token:$SIBLING_REPOS_TOKEN@github.com/".insteadOf "ssh://git@github.com/"
            git config --global --add url."https://x-access-token:$SIBLING_REPOS_TOKEN@github.com/".insteadOf "git@github.com:"
          else
            git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
            git config --global --add url."https://github.com/".insteadOf "git@github.com:"
            echo "::warning::SIBLING_REPOS_TOKEN ausente — HTTPS anônimo. Só funciona enquanto HexerVoodoom/Class-System for público."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digiapp-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # SMOKE DO APK — a ponte Capacitor↔web
  #
  # Até aqui o CI provava que o APK COMPILA e nada mais. A previsão nº 1 do
  # `investor-skeptic` é que o próximo defeito real sai da ponte Capacitor↔web
  # (`DigiWidgetPlugin` ↔ SharedPreferences), a única superfície do projeto que
  # ninguém consegue exercitar de uma máquina de desenvolvimento sem Android.
  #
  # O que este job AFIRMA (e por que cada asserção existe):
  #   1. o app SOBE e continua vivo — pega crash de inicialização, que hoje
  #      chegaria ao usuário pela Play Store sem nada avisar;
  #   2. NÃO houve `FATAL EXCEPTION` no logcat;
  #   3. a WebView carregou de verdade (o APK aponta para a URL de produção);
  #   4. **a ponte respondeu**: `DigiWidgetPrefs.xml` existe com `current_stage`.
  #      Esse arquivo só pode ter sido escrito pelo Kotlin (`DigiWidgetPlugin`)
  #      depois de o JS chamar `DigiWidget.updateWidgetData` (`src/App.tsx:411`).
  #      É JS → Capacitor → Kotlin → SharedPreferences, medido na ponta.
  #
  # LIMITE HONESTO: o APK carrega a URL de PRODUÇÃO (`capacitor.config.json >
  # server.url`), então este smoke exercita a ponte contra o site que está no ar,
  # não contra o `dist/` deste commit. Ele pega regressão nativa (Kotlin,
  # manifesto, plugin, Gradle) e NÃO pega regressão web deste PR. Trocar isso
  # exige servir o build local para o emulador, o que muda a configuração do
  # Capacitor — decisão de arquitetura, não deste job.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # EM PERÍODO DE PROVA. Este job nasceu nesta rodada e ainda não passou
    # verde nenhuma vez — não pode reprovar o build enquanto não provar que
    # sabe distinguir defeito de instabilidade de emulador. Marcar vermelho um
    # artefato BOM (o APK do job `build`, que passou) é o jeito mais rápido de
    # ensinar todo mundo a ignorar este alarme, e aí a ponte volta a não ter
    # dono — que é exatamente o problema que ele existe para resolver.
    #
    # REMOVER esta linha assim que houver um run verde: a partir daí, vermelho
    # aqui é defeito de verdade e deve bloquear.
    continue-on-error: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: digiapp-debug-${{ github.sha }}
          path: apk

      # O emulador só roda em tempo aceitável com aceleração de hardware.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Boot emulator and run smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # API 35, não 30. A imagem da API 30 embarca **WebView 83** (Chromium
          # de meados de 2020) e o app não roda nela: `src/index.css` usa
          # `oklch()` (87×), `color-mix()` (97×) e aninhamento `&:hover` (18×),
          # que pedem Chromium 111–112+, e `vite.config.ts` builda com
          # `target: 'esnext'`, sem transpilar nada.
          #
          # A primeira falha deste job foi exatamente isso: Capacitor registrou
          # os plugins, carregou a URL certa, "App started" — e o JS morreu no
          # parse, então a ponte nunca foi chamada. O smoke não errou; ele
          # reproduziu com fidelidade um usuário de WebView velho.
          #
          # Isso deixou à mostra um problema REAL de produto, registrado em
          # docs/STATUS.md: `minSdkVersion = 24` promete Android 7+, e o app
          # não entrega nisso.
          api-level: 35
          target: google_apis          # WebView e Play Services do sistema
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/apk-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-smoke-${{ github.sha }}
          path: |
            smoke-out/
          retention-days: 14
