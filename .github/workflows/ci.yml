name: CI (typecheck + testes)

# Por que este workflow existe: `CLAUDE.md:43-53` autoriza merge automático com
# "tsc/vitest/build limpos" e o fluxo real deste repo é PUSH DIRETO NA MAIN
# (D-24, dev solo). Até aqui nada verificava isso — a garantia dependia 100% de
# disciplina manual, e os dois workflows existentes (`android-build.yml`,
# `desktop-build.yml`) só provam que COMPILA, nunca que os testes passam.
#
# `push: main` importa MAIS que `pull_request` aqui, justamente porque o commit
# costuma chegar na main sem passar por PR nenhum.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# MENOR PRIVILEGIO (S-6 da auditoria de suprimentos). Sem este bloco o
# `GITHUB_TOKEN` do job herda o default da CONTA — que ninguem consegue ler pelo
# repo (e Settings > Actions) e pode ser `write-all`. Este workflow so LE o
# codigo e roda `tsc`/`vitest`: nao commita, nao abre PR, nao publica pacote,
# nao toca em Release. `contents: read` e o teto exato.
# ATENCAO ao copiar isto para outro workflow: `sync-irmaos.yml` PRECISA de
# `contents: write` + `pull-requests: write` (ele empurra branch e abre PR).
# `desktop-build.yml` ja NAO precisa mais: desde esta rodada ele so BUILDA, e
# quem publica o Release do auto-update e o arquivo separado
# `desktop-release.yml` — o unico do repo com `contents: write` para Release e
# o unico que dispara em tag de versao. Trocar o do `sync-irmaos.yml` por
# `read` quebra o sync em silencio; devolver `write` ao `desktop-build.yml`
# devolve o poder de publicar a um workflow que dispara em push de branch, que
# e exatamente o que esta rodada desmontou.
permissions:
  contents: read

# Push seguido de push na main: o run velho não interessa mais.
# `main` nunca é cancelada no meio — vermelho na main tem que aparecer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ── PARALELISMO (11/10/2026) ───────────────────────────────────────────────
# Antes: UM job em série (vendor → tsc ×3 → vitest inteiro, ~9 min só de vitest
# em 4 CPUs). Agora: os mesmos gates, em jobs paralelos —
#   • `tipos`    : os 3 `tsc` (app, overlay, servidor) em paralelo, 1 job cada;
#   • `vendor`   : integridade do bundle do Class-System;
#   • `testes`   : `vitest run --shard=N/4`, 4 runners (4 × 4 CPUs);
#   • `gate`     : agregador com o NOME ANTIGO ("tsc + vitest"), para que a
#                  proteção de branch / quem espera esse check continue valendo.
# NENHUM gate foi removido ou afrouxado: o `gate` só passa se TODOS passarem
# (`needs` + `if: always()` + conferência explícita do resultado de cada um).
# Motivos que continuam valendo (históricos, ver `git log -p` deste arquivo):
#  • `npm ci` e não `npm install` — falha se o lock dessincronizar;
#  • o `tsc -p desktop/tsconfig.json` existe porque o overlay IMPORTA de
#    `src/utils/` e `desktop-build.yml` filtra por `paths` (não pega careRules);
#  • `tsc -p tsconfig.server.json` cobre dinheiro/auth (`functions/`, `workers/`);
#  • o vendor é lido do BLOB do git, não do disco (CRLF no Windows muda o hash);
#  • não rodamos `npm run build` aqui: o `android-build.yml` já o roda na main.
# Cache: `actions/setup-node` com `cache: npm` guarda o download do npm. Não se
# acrescentou `actions/cache` (cache de node_modules/.vite) porque o SHA da
# action não pôde ser conferido para a regra de "ações presas por SHA" (S-6).
jobs:
  vendor:
    name: integridade do vendor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Integridade do vendor (sha256 do blob x _provenance.json)
        run: |
          node -e '
            const cp = require("child_process");
            const crypto = require("crypto");
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("vendor/class-system/_provenance.json", "utf8"));
            const blob = cp.execFileSync("git", ["show", "HEAD:vendor/class-system/index.js"], { maxBuffer: 1 << 28 });
            const sha = crypto.createHash("sha256").update(blob).digest("hex");
            console.log("declarado:", p.bundleSha256, p.bundleBytes, "bytes  (Class-System @ " + p.sha + ")");
            console.log("recalculado:", sha, blob.length, "bytes");
            if (sha !== p.bundleSha256 || blob.length !== p.bundleBytes) {
              console.error("::error::O bundle de vendor/class-system/index.js NAO bate com o sha256 declarado em _provenance.json. Ou o artefato foi editado a mao depois de gerado, ou a procedencia esta velha. O conserto e rodar `npm run vendor:class-system` JUNTO com `npm run sync:oracle-data` (os dois no MESMO SHA do clone irmao) e commitar os dois.");
              process.exit(1);
            }
            console.log("OK: o vendor commitado e exatamente o que o script gerou.");
          '

  tipos:
    name: tsc (${{ matrix.alvo }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - alvo: app (src/)
            cmd: npx tsc --noEmit
          - alvo: overlay desktop
            cmd: npx tsc -p desktop/tsconfig.json --noEmit
          - alvo: servidor (functions/ + workers/)
            cmd: npx tsc -p tsconfig.server.json --noEmit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck
        run: |
          if ! ${{ matrix.cmd }}; then
            echo "::error::Typecheck '${{ matrix.alvo }}' quebrou. Reproduza local com: ${{ matrix.cmd }}. (Overlay: ele importa regras de src/utils/ via desktop/renderer/src/ — se mudou assinatura/tipo lá, atualize também o overlay.)"
            exit 1
          fi

  testes:
    name: vitest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Testes (npx vitest run --shard)
        run: npx vitest run --shard=${{ matrix.shard }}/4

  gate:
    name: tsc + vitest
    if: always()
    needs: [vendor, tipos, testes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos os gates passaram?
        run: |
          echo "vendor=${{ needs.vendor.result }} tipos=${{ needs.tipos.result }} testes=${{ needs.testes.result }}"
          if [ "${{ needs.vendor.result }}" != "success" ] || [ "${{ needs.tipos.result }}" != "success" ] || [ "${{ needs.testes.result }}" != "success" ]; then
            echo "::error::Algum gate falhou ou foi cancelado (veja os jobs acima)."
            exit 1
          fi
