name: CI (typecheck + testes)

# Por que este workflow existe: `CLAUDE.md:43-53` autoriza merge automático com
# "tsc/vitest/build limpos" e o fluxo real deste repo é PUSH DIRETO NA MAIN
# (D-24, dev solo). Até aqui nada verificava isso — a garantia dependia 100% de
# disciplina manual, e os dois workflows existentes (`android-build.yml`,
# `desktop-build.yml`) só provam que COMPILA, nunca que os testes passam.
#
# `push: main` importa MAIS que `pull_request` aqui, justamente porque o commit
# costuma chegar na main sem passar por PR nenhum.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Push seguido de push na main: o run velho não interessa mais.
# `main` nunca é cancelada no meio — vermelho na main tem que aparecer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: tsc + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ⚠️ `node_modules/` ESTÁ VERSIONADO neste repo (19.035 arquivos em
      # `git ls-files node_modules`), apesar de constar no `.gitignore` — foram
      # commitados antes da regra e nunca removidos. Logo o `checkout` acima já
      # traz uma árvore de dependências no disco, e ela é a coisa mais perigosa
      # deste workflow: está DESATUALIZADA e INCOMPLETA (no run 01 um agente
      # bateu nisso e teve que rodar `npm install` na mão), então usá-la faria o
      # CI testar um conjunto de dependências que não é o do `package-lock.json`
      # — verde aqui, quebrado no build de verdade.
      #
      # ESCOLHA EXPLÍCITA: `npm ci`, que APAGA `node_modules/` antes de instalar
      # e reinstala exatamente o que o lock manda. Não é opinião de estilo: é a
      # única forma de o CI falar sobre o lockfile em vez de sobre um resíduo de
      # commit. Mesmo comando de `android-build.yml:22`.
      # (Não commitamos nada de volta; o runner é descartável.)
      # ── Repos irmãos por git+ssh ───────────────────────────────────────────
      # `class-system` (dependency) resolve para
      # `git+ssh://git@github.com/HexerVoodoom/Class-System.git`
      # (`package-lock.json:5502`). NÃO há chave SSH no runner: hoje funciona
      # só porque o repo é PÚBLICO e o npm cai sozinho no HTTPS anônimo. O dono
      # declarou que pretende tornar o repositório privado — no dia em que isso
      # acontecer, o `npm ci` abaixo morre com "Permission denied (publickey)",
      # mensagem que não parece um problema de visibilidade e vai custar horas.
      #
      # ESCOLHA, e por que as outras foram descartadas:
      #  • reescrever o lock para HTTPS — não resolve nada: HTTPS anônimo em
      #    repo privado dá 404, e o problema é AUTENTICAÇÃO, não protocolo.
      #  • deploy key (SSH) — funciona, mas obriga a manter um par de chaves e
      #    um secret por repo irmão, e o `ssh-agent` some entre steps.
      #  • `secrets.GITHUB_TOKEN` sozinho — NÃO serve: ele é escopado a ESTE
      #    repositório e não enxerga `Class-System` privado.
      #  • ESCOLHIDA: `git config url.<https+token>.insteadOf <ssh>`. Reescreve
      #    o protocolo NO RUNNER, sem tocar em `package.json`/`package-lock.json`
      #    (que são de outro dono — ver o ADR de repos irmãos do `alpha-architect`).
      #    Um único ponto, vale para qualquer dependência git futura.
      #
      # DEGRADAÇÃO DELIBERADA: sem o secret, cai no HTTPS anônimo — que é
      # exatamente o comportamento de hoje. Portanto este step nunca piora o
      # estado atual; ele só já deixa o caminho pronto para o dia do privado.
      - name: Configurar acesso aos repos irmãos (sobrevive ao repo privado)
        env:
          SIBLING_REPOS_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN }}
        # `--add` NÃO é detalhe de estilo: as duas linhas gravam a MESMA chave
        # (`url.<x>.insteadOf`) e, sem ele, a segunda SOBRESCREVE a primeira —
        # sobra só o mapeamento `git@github.com:` e a URL do lock, que é
        # `ssh://git@github.com/`, continua indo por SSH de verdade. Verificado
        # na mão: sem `--add`, `git ls-remote ssh://git@github.com/...` falha
        # com "Host key verification failed"; com `--add`, resolve o SHA.
        run: |
          if [ -n "$SIBLING_REPOS_TOKEN" ]; then
            git config --global --add url."https://x-access-token:$SIBLING_REPOS_TOKEN@github.com/".insteadOf "ssh://git@github.com/"
            git config --global --add url."https://x-access-token:$SIBLING_REPOS_TOKEN@github.com/".insteadOf "git@github.com:"
            echo "::notice::Repos irmãos: HTTPS autenticado (SIBLING_REPOS_TOKEN presente)."
          else
            git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
            git config --global --add url."https://github.com/".insteadOf "git@github.com:"
            echo "::warning::SIBLING_REPOS_TOKEN ausente — usando HTTPS ANÔNIMO. Funciona SÓ enquanto HexerVoodoom/Class-System for público. Crie o secret (PAT fine-grained, escopo Contents:read nos repos irmãos) ANTES de tornar o repo privado."
          fi

      - name: Install dependencies (npm ci — descarta o node_modules versionado)
        run: npm ci

      # Verificação EXECUTADA, não confiança no exit code do npm: se a
      # dependência de git falhar em silêncio (ou for podada), o gate tem que
      # apontar a causa em vez de estourar 40 linhas adiante.
      - name: Verificar que a dependência de git resolveu (class-system)
        run: |
          if [ ! -f node_modules/class-system/package.json ]; then
            echo "::error::class-system NÃO instalou. Se o repo irmão virou privado, crie o secret SIBLING_REPOS_TOKEN (PAT fine-grained, Contents:read em HexerVoodoom/Class-System)."
            exit 1
          fi
          node -e "console.log('class-system', require('./node_modules/class-system/package.json').version)"

      # `tsc --noEmit` cobre SÓ `src/` (`tsconfig.json > include`).
      # O typecheck de `desktop/` é o step logo abaixo — leia o comentário dele
      # antes de concluir que é duplicata do `desktop-build.yml`.
      - name: Typecheck do app (npx tsc --noEmit — só src/)
        run: npx tsc --noEmit

      # ── O BURACO QUE ESTE STEP FECHA (medido, não suposto) ────────────────
      #
      # O `desktop/renderer` DEIXOU de reimplementar as regras de cuidado e
      # passou a IMPORTAR do app (`desktop/renderer/src/care.ts:20-28` puxa
      # `src/utils/careUpdaters`, `careRules`, `playerDay`, `restWindow`;
      # `menu.ts`, `state.ts`, `sprites.ts` e os testes puxam mais). Isso é o
      # conserto certo do footgun 9 — e, de quebra, criou um acoplamento novo:
      # mudar assinatura em `src/utils/careRules.ts` agora pode quebrar o
      # overlay.
      #
      # O que JÁ estava coberto, e por isso NÃO se repete aqui:
      #  • os TESTES do desktop rodam no `npx vitest run` da raiz desde sempre —
      #    `vitest.config.ts > include` lista `desktop/renderer/**/*.test.ts`.
      #    Medido: `npx vitest run desktop/renderer` = 6 arquivos, 113 testes.
      #    Ou seja: "não existe CI do desktop" era exagero. O buraco era menor.
      #  • o BUILD do Electron (`desktop-build.yml`) é caro (windows-latest,
      #    `npm install` próprio, electron-builder, publica Release) e não tem o
      #    que fazer num PR. Continua onde está.
      #
      # O que faltava, e é EXATAMENTE isto: `tsc -p desktop/tsconfig.json`.
      # Ele só rodava em `desktop-build.yml:30`, que dispara em `push: main` E
      # com filtro de `paths` (`desktop/**`, `src/utils/sprites.ts`,
      # `src/assets/**`). `src/utils/careRules.ts` NÃO está nessa lista — logo
      # um commit que quebrasse a assinatura importada por `care.ts` não
      # acendia nem no PR nem no push da main. Era invisível dos dois lados.
      #
      # POR QUE É BARATO: `desktop/tsconfig.json` só inclui
      # `renderer/**/*.ts`, e a única dependência externa desses arquivos é
      # `vitest` (`types: ["vite/client"]`), que já veio no `npm ci` da raiz.
      # NÃO precisa de `npm install` dentro de `desktop/` — verificado com
      # `desktop/node_modules` INEXISTENTE na máquina: resolve tudo pela raiz.
      # Medido local: 2,4s. Sem segredo, roda em fork e em PR de fora.
      #
      # NOTA sobre versão: aqui roda o TypeScript da raiz (6.0.3); o
      # `desktop-build.yml` roda o do `desktop/package.json` (^5.6.3). A
      # divergência é aceita de propósito — este gate é o mais NOVO, então
      # falha aqui e passa lá significa código que vai quebrar quando o desktop
      # subir de versão. O contrário (passa aqui, falha lá) seria o problema, e
      # o build da main continua sendo a rede para isso.
      #
      # A mensagem de erro é explícita porque quem abre o PR provavelmente mexeu
      # em `src/utils/` e não faz ideia de que o overlay depende disso.
      - name: Typecheck do overlay desktop (desktop/tsconfig.json)
        run: |
          if ! npx tsc -p desktop/tsconfig.json --noEmit; then
            echo "::error::O typecheck do OVERLAY DESKTOP quebrou. Ele importa regras de src/utils/ (careRules, careUpdaters, playerDay, restWindow, sprites, cloudSave, types/progression) via desktop/renderer/src/. Se voce mudou assinatura/tipo em src/utils/, atualize tambem desktop/renderer/src/. Reproduza local com: npx tsc -p desktop/tsconfig.json --noEmit"
            exit 1
          fi

      # Servidor: `functions/` e `workers/` são JS e NÃO entravam em typecheck
      # nenhum — inclusive `_entitlements.js`/`_billing.js` (dinheiro) e
      # `_auth.js` (autorização), onde a auditoria do run 01 achou defeito real.
      # `tsconfig.server.json` liga `checkJs` e tipa pelo JSDoc que já existia.
      # FORA, de propósito e declarado lá: `scripts/` (ferramenta de build, 4
      # erros abertos), `**/*.test.js` e `desktop/`.
      - name: Typecheck do servidor (functions/ + workers/)
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Testes (npx vitest run)
        run: npx vitest run

      # NÃO rodamos `npm run build` aqui de propósito, e o motivo não é tempo:
      # é duplicação. `npm run build` = `vite build` + conversão de ~80 PNG→WebP
      # + `wrangler pages functions build`, e o `android-build.yml:25` JÁ roda
      # esse mesmo comando em TODO push na `main` — o caminho por onde o código
      # realmente entra em produção aqui. Somar um segundo build na main custaria
      # minuto de Actions para reprovar as mesmas coisas duas vezes.
      #
      # O buraco que sobra é honesto e está declarado: em PULL REQUEST o build
      # não roda (o android-build só dispara em push). Quebra que só aparece no
      # `vite build` — import quebrado que o `tsc` tolera, asset faltando,
      # `wrangler` — passa neste gate e só acende no push da main.
      # Se o fluxo passar a ser de PR de verdade, o conserto é acrescentar
      # `npm run build` num job à parte, não afrouxar este.
