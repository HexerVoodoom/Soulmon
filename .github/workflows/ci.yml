name: CI (typecheck + testes)

# Por que este workflow existe: `CLAUDE.md:43-53` autoriza merge automático com
# "tsc/vitest/build limpos" e o fluxo real deste repo é PUSH DIRETO NA MAIN
# (D-24, dev solo). Até aqui nada verificava isso — a garantia dependia 100% de
# disciplina manual, e os dois workflows existentes (`android-build.yml`,
# `desktop-build.yml`) só provam que COMPILA, nunca que os testes passam.
#
# `push: main` importa MAIS que `pull_request` aqui, justamente porque o commit
# costuma chegar na main sem passar por PR nenhum.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# MENOR PRIVILEGIO (S-6 da auditoria de suprimentos). Sem este bloco o
# `GITHUB_TOKEN` do job herda o default da CONTA — que ninguem consegue ler pelo
# repo (e Settings > Actions) e pode ser `write-all`. Este workflow so LE o
# codigo e roda `tsc`/`vitest`: nao commita, nao abre PR, nao publica pacote,
# nao toca em Release. `contents: read` e o teto exato.
# ATENCAO ao copiar isto para outro workflow: `sync-irmaos.yml` PRECISA de
# `contents: write` + `pull-requests: write` (ele empurra branch e abre PR).
# `desktop-build.yml` ja NAO precisa mais: desde esta rodada ele so BUILDA, e
# quem publica o Release do auto-update e o arquivo separado
# `desktop-release.yml` — o unico do repo com `contents: write` para Release e
# o unico que dispara em tag de versao. Trocar o do `sync-irmaos.yml` por
# `read` quebra o sync em silencio; devolver `write` ao `desktop-build.yml`
# devolve o poder de publicar a um workflow que dispara em push de branch, que
# e exatamente o que esta rodada desmontou.
permissions:
  contents: read

# Push seguido de push na main: o run velho não interessa mais.
# `main` nunca é cancelada no meio — vermelho na main tem que aparecer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: tsc + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ACOES PRESAS POR SHA (S-6 da auditoria). Tag movel (`@v4`) e reapontavel
      # pelo dono da action; o SHA nao e. As duas aqui sao do proprio GitHub —
      # risco menor que o das actions de terceiro do `android-build.yml`, mas o
      # repo passa a ter UMA regra so em vez de duas.
      # O comentario com a versao ao lado do SHA e OBRIGATORIO: sem ele ninguem
      # sabe o que esta preso nem como subir. Para atualizar:
      #   curl -s https://api.github.com/repos/<owner>/<repo>/git/ref/tags/<tag>
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # `node_modules/` JÁ NÃO É MAIS VERSIONADO — o commit `6e7aa3cd` tirou os
      # 19.035 arquivos do rastreamento. Medido agora: `git ls-files node_modules
      # | wc -l` -> 0. O texto anterior aqui dizia o contrário e virou mentira no
      # dia daquele commit; está corrigido em vez de apagado porque o MOTIVO da
      # escolha continua valendo e é o que interessa a quem lê.
      #
      # `npm ci` (e não `npm install`) segue sendo a escolha, agora por um motivo
      # só, o mais forte dos dois: ele instala EXATAMENTE o que o
      # `package-lock.json` manda e falha se o lock estiver dessincronizado do
      # `package.json`, em vez de consertar em silêncio. É a única forma de este
      # gate falar sobre o lockfile. Mesmo comando de `android-build.yml`.
      # (Não commitamos nada de volta; o runner é descartável.)

      # ── Repos irmãos: por que NÃO há mais step de token aqui ───────────────
      #
      # Até esta rodada existia aqui um step "Configurar acesso aos repos
      # irmãos" que reescrevia `git+ssh` para HTTPS com `SIBLING_REPOS_TOKEN`,
      # justificado por um texto longo dizendo que `class-system` resolvia por
      # `git+ssh://git@github.com/HexerVoodoom/Class-System.git` em
      # `package-lock.json:5502`. ESSE TEXTO DEIXOU DE SER VERDADE quando o
      # `vendor/` entrou (ADR-002 §1): a dependência de git saiu do
      # `package.json` e do `package-lock.json`, e o motor passou a ser um
      # artefato COMMITADO em `vendor/class-system/index.js` — conferido pelo
      # step de integridade logo abaixo.
      #
      # MEDIDO nesta máquina antes de apagar (não é dedução):
      #   grep -c "class-system" package-lock.json          -> 0
      #   grep -cE 'git\+ssh|git\+https|"resolved": "git' package-lock.json         -> 0
      #   grep -cE 'git\+ssh|git\+https|"resolved": "git' desktop/package-lock.json -> 0
      # Ou seja: NENHUMA dependência dos dois lockfiles resolve por git. O
      # `npm ci` abaixo fala só com o registry (e com `npm.jsr.io`, via
      # `.npmrc`). O `url.<x>.insteadOf` reescreve remoto de GIT — não tem o que
      # reescrever, e o step era um no-op caro de ler.
      #
      # E o Besti-rio-? Ele TAMBÉM não passa por aqui. Quem clona os dois repos
      # irmãos é o `sync-irmaos.yml`, uma vez por semana, e ele NÃO depende de
      # `insteadOf`: monta a URL HTTPS autenticada na mão
      # (`https://x-access-token:$SIBLING_REPOS_TOKEN@github.com/...`, steps
      # "Clonar os repos irmãos"). Logo o secret continua existindo e continua
      # tendo dono — só que o dono é o `sync-irmaos.yml`, não este arquivo.
      #
      # O QUE ISTO CUSTA, declarado: se um dia voltar uma dependência de git no
      # lock, o `npm ci` vai tentar SSH e falhar em repo privado. O conserto NÃO
      # é ressuscitar este step — é não voltar a ter dependência de git (a
      # decisão do ADR-002 §1). Se voltar mesmo assim, o step está no histórico.
      - name: Install dependencies (npm ci — instala exatamente o lockfile)
        run: npm ci

      # ── ESTE STEP SUBSTITUI UM GATE QUE ESTAVA MORTO ─────────────────────
      #
      # O que estava aqui ate agora exigia `node_modules/class-system/package.json`
      # e falhava com "class-system NAO instalou". Ele nao podia passar NUNCA:
      # a dependencia de git saiu do `package.json` e do `package-lock.json`
      # quando o `vendor/` entrou (ADR-002 §1, `docs/STATUS.md`). Conferido nesta
      # maquina, e o comando esta colado no relatorio:
      #   grep -c "class-system" package-lock.json  ->  0
      #   grep -n  "class-system" package.json      ->  so o script `vendor:class-system`
      #   ls node_modules/class-system              ->  No such file or directory
      # Ou seja: `npm ci` instala exatamente o lock, o lock nao tem `class-system`,
      # o arquivo nunca existe, o step sempre da exit 1 — e derruba junto os
      # `tsc` e o `vitest` que vem DEPOIS dele, que sao o motivo de o workflow
      # existir. Gate que sempre reprova e gate que alguem desliga.
      #
      # O QUE ENTRA NO LUGAR, e por que e a verificacao que importa hoje:
      # o motor do Class-System agora entra como ARTEFATO COMMITADO em
      # `vendor/class-system/index.js`, com procedencia declarada em
      # `_provenance.json` (repo, ref, sha do commit irmao, bytes e sha256 do
      # bundle). Nada no repo conferia esse sha256 — procedencia que ninguem
      # recalcula e procedencia decorativa. Este step recalcula.
      #
      # 🔴 LE O BLOB DO GIT (`git show HEAD:...`), NAO O ARQUIVO DO DISCO.
      # `core.autocrlf` transforma LF em CRLF no checkout do Windows e o arquivo
      # do disco da OUTRO hash (medido: 232533 bytes no disco contra 226978 no
      # blob, sha256 completamente diferente). Quem escrever isto lendo o disco
      # cria um teste que reprova sozinho e vai ser desligado na semana seguinte.
      # No runner ubuntu o disco bate — justamente por isso o erro passaria aqui
      # e so apareceria na maquina do dono. Ler o blob e correto nos dois.
      - name: Integridade do vendor (sha256 do blob x _provenance.json)
        run: |
          node -e '
            const cp = require("child_process");
            const crypto = require("crypto");
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("vendor/class-system/_provenance.json", "utf8"));
            const blob = cp.execFileSync("git", ["show", "HEAD:vendor/class-system/index.js"], { maxBuffer: 1 << 28 });
            const sha = crypto.createHash("sha256").update(blob).digest("hex");
            console.log("declarado:", p.bundleSha256, p.bundleBytes, "bytes  (Class-System @ " + p.sha + ")");
            console.log("recalculado:", sha, blob.length, "bytes");
            if (sha !== p.bundleSha256 || blob.length !== p.bundleBytes) {
              console.error("::error::O bundle de vendor/class-system/index.js NAO bate com o sha256 declarado em _provenance.json. Ou o artefato foi editado a mao depois de gerado, ou a procedencia esta velha. O conserto e rodar `npm run vendor:class-system` JUNTO com `npm run sync:oracle-data` (os dois no MESMO SHA do clone irmao) e commitar os dois.");
              process.exit(1);
            }
            console.log("OK: o vendor commitado e exatamente o que o script gerou.");
          '

      # `tsc --noEmit` cobre SÓ `src/` (`tsconfig.json > include`).
      # O typecheck de `desktop/` é o step logo abaixo — leia o comentário dele
      # antes de concluir que é duplicata do `desktop-build.yml`.
      - name: Typecheck do app (npx tsc --noEmit — só src/)
        run: npx tsc --noEmit

      # ── O BURACO QUE ESTE STEP FECHA (medido, não suposto) ────────────────
      #
      # O `desktop/renderer` DEIXOU de reimplementar as regras de cuidado e
      # passou a IMPORTAR do app (`desktop/renderer/src/care.ts:20-28` puxa
      # `src/utils/careUpdaters`, `careRules`, `playerDay`, `restWindow`;
      # `menu.ts`, `state.ts`, `sprites.ts` e os testes puxam mais). Isso é o
      # conserto certo do footgun 9 — e, de quebra, criou um acoplamento novo:
      # mudar assinatura em `src/utils/careRules.ts` agora pode quebrar o
      # overlay.
      #
      # O que JÁ estava coberto, e por isso NÃO se repete aqui:
      #  • os TESTES do desktop rodam no `npx vitest run` da raiz desde sempre —
      #    `vitest.config.ts > include` lista `desktop/renderer/**/*.test.ts`.
      #    Medido: `npx vitest run desktop/renderer` = 6 arquivos, 113 testes.
      #    Ou seja: "não existe CI do desktop" era exagero. O buraco era menor.
      #  • o BUILD do Electron (`desktop-build.yml`) é caro (windows-latest,
      #    `npm install` próprio, electron-builder, publica Release) e não tem o
      #    que fazer num PR. Continua onde está.
      #
      # O que faltava, e é EXATAMENTE isto: `tsc -p desktop/tsconfig.json`.
      # Ele só rodava em `desktop-build.yml:30`, que dispara em `push: main` E
      # com filtro de `paths` (`desktop/**`, `src/utils/sprites.ts`,
      # `src/assets/**`). `src/utils/careRules.ts` NÃO está nessa lista — logo
      # um commit que quebrasse a assinatura importada por `care.ts` não
      # acendia nem no PR nem no push da main. Era invisível dos dois lados.
      #
      # POR QUE É BARATO: `desktop/tsconfig.json` só inclui
      # `renderer/**/*.ts`, e a única dependência externa desses arquivos é
      # `vitest` (`types: ["vite/client"]`), que já veio no `npm ci` da raiz.
      # NÃO precisa de `npm install` dentro de `desktop/` — verificado com
      # `desktop/node_modules` INEXISTENTE na máquina: resolve tudo pela raiz.
      # Medido local: 2,4s. Sem segredo, roda em fork e em PR de fora.
      #
      # NOTA sobre versão: aqui roda o TypeScript da raiz (6.0.3); o
      # `desktop-build.yml` roda o do `desktop/package.json` (^5.6.3). A
      # divergência é aceita de propósito — este gate é o mais NOVO, então
      # falha aqui e passa lá significa código que vai quebrar quando o desktop
      # subir de versão. O contrário (passa aqui, falha lá) seria o problema, e
      # o build da main continua sendo a rede para isso.
      #
      # A mensagem de erro é explícita porque quem abre o PR provavelmente mexeu
      # em `src/utils/` e não faz ideia de que o overlay depende disso.
      - name: Typecheck do overlay desktop (desktop/tsconfig.json)
        run: |
          if ! npx tsc -p desktop/tsconfig.json --noEmit; then
            echo "::error::O typecheck do OVERLAY DESKTOP quebrou. Ele importa regras de src/utils/ (careRules, careUpdaters, playerDay, restWindow, sprites, cloudSave, types/progression) via desktop/renderer/src/. Se voce mudou assinatura/tipo em src/utils/, atualize tambem desktop/renderer/src/. Reproduza local com: npx tsc -p desktop/tsconfig.json --noEmit"
            exit 1
          fi

      # Servidor: `functions/` e `workers/` são JS e NÃO entravam em typecheck
      # nenhum — inclusive `_entitlements.js`/`_billing.js` (dinheiro) e
      # `_auth.js` (autorização), onde a auditoria do run 01 achou defeito real.
      # `tsconfig.server.json` liga `checkJs` e tipa pelo JSDoc que já existia.
      # FORA, de propósito e declarado lá: `scripts/` (ferramenta de build, 4
      # erros abertos), `**/*.test.js` e `desktop/`.
      - name: Typecheck do servidor (functions/ + workers/)
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Testes (npx vitest run)
        run: npx vitest run

      # NÃO rodamos `npm run build` aqui de propósito, e o motivo não é tempo:
      # é duplicação. `npm run build` = `vite build` + conversão de ~80 PNG→WebP
      # + `wrangler pages functions build`, e o `android-build.yml:25` JÁ roda
      # esse mesmo comando em TODO push na `main` — o caminho por onde o código
      # realmente entra em produção aqui. Somar um segundo build na main custaria
      # minuto de Actions para reprovar as mesmas coisas duas vezes.
      #
      # O buraco que sobra é honesto e está declarado: em PULL REQUEST o build
      # não roda (o android-build só dispara em push). Quebra que só aparece no
      # `vite build` — import quebrado que o `tsc` tolera, asset faltando,
      # `wrangler` — passa neste gate e só acende no push da main.
      # Se o fluxo passar a ser de PR de verdade, o conserto é acrescentar
      # `npm run build` num job à parte, não afrouxar este.
