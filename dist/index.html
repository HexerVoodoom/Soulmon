      <!-- FONTES — self-hosted em `/fonts/`, NUNCA de CDN.
           `public/sw.js` ignora toda requisição cross-origin
           (`if (url.origin !== self.location.origin) return;`), então fonte
           vinda de fonts.gstatic.com jamais entra no cache e some quando o
           app abre offline — que é metade do uso de um PWA de bichinho.
           Servida daqui, ela cai na regra cache-first de same-origin que já
           existe. Os @font-face ficam em `src/index.css` (o único CSS
           empacotado, footgun 1); estes preloads existem só para o
           carregador não esperar o CSS parsear para descobrir as três fontes
           da primeira tela. `crossorigin` é OBRIGATÓRIO mesmo same-origin:
           fonte é requisição em modo CORS, e sem o atributo o preload é
           descartado e o arquivo baixa DUAS vezes.
           `as="font"` + woff2: só os subsets latin, que é o que a primeira
           tela usa; latin-ext chega sob demanda pelo unicode-range. -->
      <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/rubik-latin.woff2" />
      <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/fredoka-latin.woff2" />
      <!-- A Material Symbols (145 KB) NÃO é preloadada de propósito: ela usa
           `font-display: block` e só é buscada quando um ícone realmente
           renderiza. Preload dela hoje seriam 145 KB no caminho crítico sem
           nenhum ícone na tela — mais um aviso de "preloaded but not used" no
           console. Quando a barra inferior passar a usar `<Icon>`, ela vira o
           primeiro glifo acima da dobra e a linha entra aqui. -->

      <script>
        (function () {
          try {
            var stored = localStorage.getItem('digiapp-theme');
            var mode = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
            // O visual do jogo (moldura cobre, teal escuro) só existe no tema
            // escuro — sem preferência salva, o padrão é escuro, não o SO.
            var resolved = mode === 'system' ? 'dark' : mode;
            document.documentElement.dataset.theme = resolved;
          } catch (e) {}
        })();
      </script>

    <style>
      /* SPLASH — estática de propósito: aparece ANTES do bundle carregar
         (é uma tela de loading de verdade, não um timer artificial). O React
         a remove com fade no primeiro frame (main.tsx); se o bundle nem
         parsear, o aviso de WebView antigo a remove também, senão ela
         cobriria o aviso.

         É o momento de maior carga de marca do app: 100% dos cold starts
         passam por aqui. Até agosto/2026 ele era uma QUARTA linguagem visual
         — ~60 linhas de hex cravado (#5df0e0 / #c68642 / #0e2323), texto a
         11 e 12px e um selo dentro de caixa com borda de cobre de 2px, que é
         exatamente a moldura de fliperama que a regra do dono matou.

         TOKENS COPIADOS À MÃO, e a cópia é deliberada: esta tela roda ANTES
         do bundle, então nenhum valor de `src/index.css` está disponível
         aqui. A FONTE DA VERDADE é `src/index.css` (blocos
         `[data-theme="dark"]` e o de tipografia/raio) + `src/styles/tokens.md`
         — ao mudar a paleta lá, atualize estes valores junto. Os valores
         abaixo são os do TEMA ESCURO de propósito: o splash é o VISOR do
         aparelho ligando, e o visor é escuro nos dois temas (regra travada em
         `src/styles/tokens.contrast.test.ts`). */
      #splash {
        /* — cópia de src/index.css, bloco [data-theme="dark"] — */
        --sm2-viewport-bg: #071413;
        --sm2-viewport-ink: #E9F5F2;
        --sm2-surface: #0F2A29;
        --sm2-surface-2: #163735;
        --sm2-line: #1E3F3C;
        --sm2-muted: #9DBCB4;
        --sm2-primary-ink: #5FF3E0;
        --sm2-primary-deep: #29C9B8;
        /* — cópia do bloco de tipografia/raio (invariante de tema) — */
        --sm2-text-sm: 14px;
        --sm2-text-2xl: 32px;
        --sm2-radius-sm: 4px;
        /* A voz do APARELHO é a Silkscreen, e o splash é o aparelho ligando.
           O `ui-monospace` que estava aqui é a pilha que `tokens.md` §4
           proíbe (indistinguível da Rubik em tamanho pequeno). A Silkscreen
           chega com o bundle e NÃO é preloadada — baixar fonte nova no
           caminho crítico atrasaria o LCP desta própria tela, que é o único
           conteúdo pintado até lá. Por isso o fallback é uma face de
           máquina de escrever concreta (e não o mono da UI): quando a
           Silkscreen entra, ela troca sem mudar o papel do texto. */
        --sm2-font-pixel: 'Silkscreen', 'Courier New', 'DejaVu Sans Mono', monospace;

        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; text-align: center;
        /* Cor sólida separada das camadas decorativas de propósito: se o
           `color-mix` não for suportado, o navegador descarta só o
           `background-image` e a tela continua com o fundo do visor — em vez
           de cair para transparente e deixar a splash ilegível. */
        background-color: var(--sm2-viewport-bg);
        background-image:
          radial-gradient(circle at 50% -10%, color-mix(in srgb, var(--sm2-primary-ink) 10%, transparent), transparent 55%),
          repeating-linear-gradient(0deg, transparent 0 47px, color-mix(in srgb, var(--sm2-primary-ink) 5%, transparent) 47px 48px),
          repeating-linear-gradient(90deg, transparent 0 47px, color-mix(in srgb, var(--sm2-primary-ink) 5%, transparent) 47px 48px),
          linear-gradient(180deg, var(--sm2-viewport-bg) 0%, var(--sm2-surface) 55%, var(--sm2-viewport-bg) 100%);
        font-family: var(--sm2-font-pixel);
        color: var(--sm2-viewport-ink);
        transition: opacity .45s ease;
      }
      #splash.done { opacity: 0; pointer-events: none; }
      /* Sem moldura, sem placa, sem fundo em volta do ícone — regra do dono. */
      #splash .sp-flame {
        width: 48px; height: 76px; image-rendering: pixelated;
        filter:
          drop-shadow(0 0 10px color-mix(in srgb, var(--sm2-primary-ink) 80%, transparent))
          drop-shadow(0 0 26px color-mix(in srgb, var(--sm2-primary-ink) 40%, transparent));
        animation: sp-flick 1.15s ease-in-out infinite;
      }
      /* A chama é a do kit de marca (E:/logo/soul-flame-solo, vetorizada em
         15/09/2026 — um <rect> por pixel, cores da MARCA, não de token: a
         marca é a mesma nos dois temas). Proporção 19×30. */
      @keyframes sp-flick {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.14) translateY(-1px); }
      }
      #splash .sp-title {
        margin: 0; font-size: var(--sm2-text-2xl); font-weight: 400; letter-spacing: .12em;
        text-transform: uppercase; color: var(--sm2-primary-ink);
        text-shadow: 0 0 12px color-mix(in srgb, var(--sm2-primary-ink) 45%, transparent);
      }
      /* 14px é o PISO da Silkscreen (abaixo disso o bitmap fecha os contra-
         formatos) e é também o piso de "texto que o usuário lê para saber o
         que está acontecendo". Era 12px e 11px. */
      #splash .sp-loading {
        font-size: var(--sm2-text-sm); letter-spacing: .16em; color: var(--sm2-muted);
      }
      #splash .sp-bar {
        width: 220px; height: 16px; padding: 2px; box-sizing: border-box;
        background: var(--sm2-surface-2); border: 1px solid var(--sm2-line);
        border-radius: var(--sm2-radius-sm); display: flex; gap: 2px;
      }
      #splash .sp-bar i {
        flex: 1; background: var(--sm2-primary-ink); opacity: .15; animation: sp-seg 1.6s linear infinite;
      }
      @keyframes sp-seg { 0%, 20% { opacity: .15; } 30%, 70% { opacity: .95; } 80%, 100% { opacity: .15; } }
      /* Era um selo DENTRO de uma caixa com borda de cobre de 2px. A caixa
         saiu; o que informa é a palavra, não a moldura. */
      #splash .sp-link {
        font-size: var(--sm2-text-sm); letter-spacing: .16em; color: var(--sm2-primary-ink);
      }
      #splash .sp-crystals { display: flex; gap: 26px; margin-top: 6px; }
      #splash .sp-crystal {
        width: 14px; height: 26px;
        background: linear-gradient(160deg, var(--sm2-viewport-ink) 0%, var(--sm2-primary-ink) 45%, var(--sm2-primary-deep) 100%);
        clip-path: polygon(50% 0, 100% 30%, 78% 100%, 22% 100%, 0 30%);
        box-shadow: 0 0 12px color-mix(in srgb, var(--sm2-primary-ink) 60%, transparent);
        animation: sp-flick 1.6s ease-in-out infinite;
      }
      #splash .sp-crystal:nth-child(2) { height: 34px; width: 17px; animation-delay: .3s; }
      #splash .sp-crystal:nth-child(3) { animation-delay: .6s; }
    </style>

<rect x="14" y="18" width="1" height="1"/><rect x="16" y="18" width="1" height="1"/><rect x="17" y="20" width="1" height="1"/><rect x="17" y="21" width="1" height="1"/><rect x="17" y="22" width="1" height="1"/><rect x="6" y="28" width="1" height="1"/><rect x="7" y="28" width="1" height="1"/><rect x="9" y="28" width="1" height="1"/><rect x="10" y="28" width="1" height="1"/><rect x="11" y="28" width="1" height="1"/></g><g fill="#45cff4"><rect x="12" y="23" width="1" height="1"/><rect x="12" y="24" width="1" height="1"/></g><g fill="#2abbe5"><rect x="6" y="24" width="1" height="1"/><rect x="7" y="24" width="1" height="1"/></g></svg>
        <h1 class="sp-title">Soulmon</h1>
        <div class="sp-loading" id="sp-loading">LOADING DATA...</div>
        <div class="sp-bar" aria-hidden="true"><i style="animation-delay:0s"></i><i style="animation-delay:.14s"></i><i style="animation-delay:.28s"></i><i style="animation-delay:.42s"></i><i style="animation-delay:.56s"></i><i style="animation-delay:.7s"></i><i style="animation-delay:.84s"></i><i style="animation-delay:.98s"></i></div>
        <div class="sp-link" id="sp-link">SOUL_LINK ESTABLISHED</div>
        <div class="sp-crystals" aria-hidden="true"><div class="sp-crystal"></div><div class="sp-crystal"></div><div class="sp-crystal"></div></div>
      </div>
      <script>
        // Localiza a splash sem esperar o bundle (regra do app: PT-BR + EN).
        (function () {
          try {
            if ((navigator.language || '').toLowerCase().indexOf('pt') === 0) {
              document.getElementById('sp-loading').textContent = 'CARREGANDO DADOS...';
              document.getElementById('sp-link').textContent = 'SOUL_LINK ESTABELECIDO';
            }
          } catch (e) {}
        })();
      </script>
      <script>
        // AVISO DE WEBVIEW ANTIGO — roda ANTES do bundle, de propósito.
        //
        // O app usa oklch(), color-mix() e aninhamento de CSS, e builda com
        // target 'esnext' (sem transpilar). Num navegador antigo o bundle morre
        // no parse e o usuário fica com TELA BRANCA, sem explicação. Foi assim
        // que ele se comportou no emulador da API 30 (WebView 83, de 2020).
        //
        // Isso não é hipótese de laboratório: no Android o WebView se atualiza
        // SEPARADO do sistema, então um aparelho novo com WebView travado
        // quebra igual — e `minSdkVersion = 24` faz a Play Store oferecer o app
        // para exatamente esse público.
        //
        // Este bloco não conserta a incompatibilidade: troca uma tela branca
        // por uma frase acionável. Se o bundle carregar, o React substitui
        // este conteúdo e nada disto aparece.
        (function () {
          try {
            var ok =
              typeof CSS !== 'undefined' &&
              CSS.supports &&
              CSS.supports('color', 'oklch(0 0 0)') &&
              CSS.supports('color', 'color-mix(in srgb, red, blue)');
            if (ok) return;

            var pt = (navigator.language || '').toLowerCase().indexOf('pt') === 0;
            var titulo = pt ? 'Precisamos de uma atualização' : 'An update is needed';
            var corpo = pt
              ? 'O componente que desenha páginas no seu aparelho (Android System WebView) está desatualizado e não consegue abrir o Soulmon.'
              : 'The component that renders pages on your device (Android System WebView) is out of date and cannot open Soulmon.';
            var comoT = pt ? 'Como resolver' : 'How to fix it';
            var como = pt
              ? 'Abra a Play Store, procure por "Android System WebView" e por "Google Chrome", atualize os dois e abra o Soulmon de novo.'
              : 'Open the Play Store, search for "Android System WebView" and "Google Chrome", update both, then open Soulmon again.';

            // Montado com createElement + textContent, não com concatenação de
            // HTML. O user agent é dado de fora; filtrar caractere depois de
            // concatenar é o padrão que produz XSS quando alguém acrescenta o
            // próximo campo ao lado. Aqui não existe caminho de injeção.
            var raiz = document.getElementById('root');
            var fundo = document.createElement('div');
            fundo.setAttribute(
              'style',
              'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;' +
                'background:#0c1c1a;color:#e6f4f1;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;'
            );
            var caixa = document.createElement('div');
            caixa.setAttribute('style', 'max-width:34rem;line-height:1.55');

            function linha(tag, texto, estilo) {
              var el = document.createElement(tag);
              el.textContent = texto;
              el.setAttribute('style', estilo);
              caixa.appendChild(el);
            }

            linha('h1', titulo, 'font-size:1.35rem;margin:0 0 12px;color:#5eead4');
            linha('p', corpo, 'margin:0 0 16px');
            linha('h2', comoT, 'font-size:1rem;margin:0 0 8px;color:#5eead4');
            linha('p', como, 'margin:0 0 20px');
            linha('p', 'WebView: ' + (navigator.userAgent || ''), 'margin:0;font-size:.8rem;opacity:.6');

            fundo.appendChild(caixa);
            raiz.innerHTML = '';
            raiz.appendChild(fundo);
            // A splash fica ACIMA do #root: sem esta linha, o aviso que este
            // bloco acabou de montar ficaria escondido atrás dela pra sempre
            // (o bundle que a removeria é justamente o que não vai carregar).
            var sp = document.getElementById('splash');
            if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
          } catch (e) {}
        })();
      </script>

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .catch(() => {});
          });
        }
      </script>
