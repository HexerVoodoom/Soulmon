
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
      <title>Soulmon</title>
      <!-- Descrição e Open Graph: sem isto o link chega "pelado" em qualquer
           chat/rede (achado do QA geral de 21/09/2026 — `grep og: index.html`
           dava 0). A frase é a essência declarada (`01-VISAO.md` §2): avatar
           que evolui COM a pessoa, nunca um cobrador. A imagem é o ícone 512
           já servido pelo Worker; trocar por um key visual 1200×630 quando a
           squad-arte gerar um (fila em `docs/ASSETS-A-GERAR.md`). -->
      <meta name="description" content="It grows with your day. Habits and tasks become care, evolution and story — never nagging." />
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="Soulmon" />
      <meta property="og:title" content="Soulmon — the companion that evolves with you" />
      <meta property="og:description" content="It grows with your day. Habits and tasks become care, evolution and story — never nagging." />
      <meta property="og:image" content="https://soulmon.mateus-sprnd.workers.dev/og-image.png" />
      <meta property="og:image:width" content="1200" />

      <meta property="og:locale" content="en_US" />
      <meta property="og:locale:alternate" content="pt_BR" />

      <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f766e" />
      <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#071413" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

      <!-- FONTES — self-hosted em `/fonts/`, NUNCA de CDN.
           `public/sw.js` ignora toda requisição cross-origin
           (`if (url.origin !== self.location.origin) return;`), então fonte
           vinda de fonts.gstatic.com jamais entra no cache e some quando o
           app abre offline — que é metade do uso de um PWA de bichinho.
           Servida daqui, ela cai na regra cache-first de same-origin que já
           existe. Os @font-face ficam em `src/index.css` (o único CSS
           empacotado, footgun 1); estes preloads existem só para o
           carregador não esperar o CSS parsear para descobrir as três fontes
           da primeira tela. `crossorigin` é OBRIGATÓRIO mesmo same-origin:
           fonte é requisição em modo CORS, e sem o atributo o preload é
           descartado e o arquivo baixa DUAS vezes.
           `as="font"` + woff2: só os subsets latin, que é o que a primeira
           tela usa; latin-ext chega sob demanda pelo unicode-range. -->
      <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/rubik-latin.woff2" />
      <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/cinzel-latin.woff2" />
      <!-- A Material Symbols (145 KB) NÃO é preloadada de propósito: ela usa
           `font-display: block` e só é buscada quando um ícone realmente
           renderiza. Preload dela hoje seriam 145 KB no caminho crítico sem
           nenhum ícone na tela — mais um aviso de "preloaded but not used" no
           console. Quando a barra inferior passar a usar `<Icon>`, ela vira o
           primeiro glifo acima da dobra e a linha entra aqui. -->

      <script>
        (function () {
          try {
            // Mesma chave de `STORAGE_KEYS.THEME` (src/utils/storageKeys.ts).
            // Lia `digiapp-theme` até o QA de 21/09/2026 — a chave morreu em
            // 07/09 e o anti-flash ignorava a preferência salva do jogador.
            var stored = localStorage.getItem('soulmon-theme');
            var mode = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
            // O visual do jogo (moldura cobre, teal escuro) só existe no tema
            // escuro — sem preferência salva, o padrão é escuro, não o SO.
            var resolved = mode === 'system' ? 'dark' : mode;
            document.documentElement.dataset.theme = resolved;
          } catch (e) {}
        })();
      </script>
      <script type="module" crossorigin src="/assets/index-D_rNYAxI.js"></script>
      <link rel="modulepreload" crossorigin href="/assets/vendor-DDxydHEc.js">
      <link rel="modulepreload" crossorigin href="/assets/vendor-sonner-BFkWhx6y.js">
      <link rel="modulepreload" crossorigin href="/assets/vendor-capacitor-B8vh4tkU.js">
      <link rel="stylesheet" crossorigin href="/assets/index-98rU5CY1.css">
    </head>

    <!-- SPLASH — estática de propósito: aparece ANTES do bundle carregar (é
         uma tela de loading de verdade, não um timer artificial). O React a
         remove com fade no primeiro frame (main.tsx); se o bundle nem parsear,
         o aviso de WebView antigo a remove também.

         Desde 14/10/2026 (REGISTRO §50) é só o fundo do visor com UMA barra fina
         turquesa que enche (a MESMA `.sm2-loadbar` do componente `LoadingBar`):
         sem chama, wordmark, texto nem cristais. O CSS vive em `src/index.css`
         (`.sm2-visor` + `.sm2-splash` + `.sm2-loadbar`); no build entra pelo
         `<link>` bloqueante do `<head>`, então a splash lê os tokens de lá. -->

    <body>
      <div id="root"></div>
      <div id="splash" class="sm2-visor sm2-splash">
        <div class="sm2-loadbar sm2-loadbar-boot" id="sp-bar" role="progressbar" aria-busy="true" aria-label="Loading"><i></i></div>
      </div>
      <script>
        // Localiza a splash sem esperar o bundle (regra do app: PT-BR + EN).
        (function () {
          try {
            if ((navigator.language || '').toLowerCase().indexOf('pt') === 0) {
              document.getElementById('sp-bar').setAttribute('aria-label', 'Carregando');
            }
          } catch (e) {}
        })();
      </script>
      <script>
        // AVISO DE WEBVIEW ANTIGO — roda ANTES do bundle, de propósito.
        //
        // O app usa oklch(), color-mix() e aninhamento de CSS, e builda com
        // target 'esnext' (sem transpilar). Num navegador antigo o bundle morre
        // no parse e o usuário fica com TELA BRANCA, sem explicação. Foi assim
        // que ele se comportou no emulador da API 30 (WebView 83, de 2020).
        //
        // O gate testa o requisito MAIS NOVO do `src/index.css`, não o mais
        // conhecido: oklch()/color-mix() chegaram no Chromium 111, mas o
        // aninhamento (`&:hover` dentro da regra, 122 ocorrências) só existe
        // a partir do 112 — um WebView 111 passava no teste antigo e abria o
        // app com o kit inteiro sem hover/foco/variante, que é pior que a
        // tela branca porque parece bug nosso. `selector(&)` é a forma
        // padrão de perguntar por aninhamento (QA geral de 21/09/2026, #19).
        //
        // Isso não é hipótese de laboratório: no Android o WebView se atualiza
        // SEPARADO do sistema, então um aparelho novo com WebView travado
        // quebra igual — e `minSdkVersion = 24` faz a Play Store oferecer o app
        // para exatamente esse público.
        //
        // Este bloco não conserta a incompatibilidade: troca uma tela branca
        // por uma frase acionável. Se o bundle carregar, o React substitui
        // este conteúdo e nada disto aparece.
        (function () {
          try {
            var ok =
              typeof CSS !== 'undefined' &&
              CSS.supports &&
              CSS.supports('color', 'oklch(0 0 0)') &&
              CSS.supports('color', 'color-mix(in srgb, red, blue)') &&
              CSS.supports('selector(&)');
            if (ok) return;

            var pt = (navigator.language || '').toLowerCase().indexOf('pt') === 0;
            // Só o WEBVIEW do Android é "Android System WebView" — e o ramo
            // com os dois botões da Play só serve para ele. Samsung Internet,
            // Firefox Android e qualquer navegador de terceiro rodando em
            // Android caíam no mesmo texto e eram mandados atualizar um
            // componente que não usam (QA rodada 2, skeptic #5 / design A8).
            // A marca do WebView é `; wv)` no UA (Android 5+), ou o UA antigo
            // `Version/X.Y ... Chrome/` (WebView do Android 4.4). iOS/desktop
            // seguem no genérico (skeptic #4 / design D3, 21/09/2026).
            var ua = navigator.userAgent || '';
            var android = /Android/i.test(ua)
              && (/; wv\)/.test(ua) || /Version\/\d+\.\d+ .*Chrome\//.test(ua))
              && !/Firefox|SamsungBrowser|EdgA|OPR\//.test(ua);
            try { document.documentElement.lang = pt ? 'pt-BR' : 'en'; } catch (e2) {}
            var titulo = pt ? 'Precisamos de uma atualização' : 'An update is needed';
            var corpo, comoT, como;
            if (android) {
              corpo = pt
                ? 'O componente que desenha páginas no seu aparelho (Android System WebView) está desatualizado e não consegue abrir o Soulmon.'
                : 'The component that renders pages on your device (Android System WebView) is out of date and cannot open Soulmon.';
              comoT = pt ? 'Como resolver' : 'How to fix it';
              como = pt
                ? 'Atualize os dois na Play Store e abra o Soulmon de novo:'
                : 'Update both on the Play Store, then open Soulmon again:';
            } else {
              corpo = pt
                ? 'Seu navegador está desatualizado e não consegue abrir o Soulmon.'
                : 'Your browser is out of date and cannot open Soulmon.';
              comoT = pt ? 'Como resolver' : 'How to fix it';
              como = pt
                ? 'Atualize o navegador (ou abra o Soulmon em outro mais recente) e tente de novo.'
                : 'Update your browser (or open Soulmon in a newer one) and try again.';
            }
            var contato = pt ? 'Se continuar travado, escreva para ' : 'If it stays stuck, write to ';
            // Mesmo endereço de `src/components/FeedbackLink.tsx` › FEEDBACK_EMAIL
            // (contrato em tests/indexHtmlGateWebView.test.ts compara os dois).
            var email = 'mateus.sprnd@gmail.com';

            // Montado com createElement + textContent, não com concatenação de
            // HTML. O user agent é dado de fora; filtrar caractere depois de
            // concatenar é o padrão que produz XSS quando alguém acrescenta o
            // próximo campo ao lado. Aqui não existe caminho de injeção.
            var raiz = document.getElementById('root');
            var fundo = document.createElement('div');
            fundo.setAttribute(
              'style',
              'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;' +
                'background:#0c1c1a;color:#e6f4f1;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;'
            );
            var caixa = document.createElement('div');
            caixa.setAttribute('style', 'max-width:34rem;line-height:1.55');

            function linha(tag, texto, estilo) {
              var el = document.createElement(tag);
              el.textContent = texto;
              el.setAttribute('style', estilo);
              caixa.appendChild(el);
              return el;
            }
            function botaoLoja(texto, pacote) {
              var a = document.createElement('a');
              a.textContent = texto;
              a.setAttribute('href', 'https://play.google.com/store/apps/details?id=' + pacote);
              a.setAttribute('rel', 'noopener');
              a.setAttribute(
                'style',
                'display:block;min-height:44px;box-sizing:border-box;padding:12px 16px;margin:0 0 10px;' +
                  'border-radius:10px;background:#0f766e;color:#ffffff;text-decoration:none;font-weight:600;text-align:center'
              );
              caixa.appendChild(a);
            }

            linha('h1', titulo, 'font-size:1.35rem;margin:0 0 12px;color:#5eead4');
            linha('p', corpo, 'margin:0 0 16px');
            linha('h2', comoT, 'font-size:1rem;margin:0 0 8px;color:#5eead4');
            linha('p', como, 'margin:0 0 ' + (android ? '12px' : '20px'));
            if (android) {
              botaoLoja(pt ? 'Atualizar Android System WebView' : 'Update Android System WebView', 'com.google.android.webview');
              botaoLoja(pt ? 'Atualizar Google Chrome' : 'Update Google Chrome', 'com.android.chrome');
            }
            var pc = linha('p', contato, 'margin:' + (android ? '10px' : '0') + ' 0 16px;font-size:.9rem');
            var mail = document.createElement('a');
            mail.textContent = email;
            mail.setAttribute('href', 'mailto:' + email);
            mail.setAttribute('style', 'color:#5eead4');
            pc.appendChild(mail);
            pc.appendChild(document.createTextNode('.'));
            linha('p', (android ? 'WebView: ' : 'Browser: ') + (navigator.userAgent || ''), 'margin:0;font-size:.8rem;opacity:.6');

            fundo.appendChild(caixa);
            raiz.innerHTML = '';
            raiz.appendChild(fundo);
            // A splash fica ACIMA do #root: sem esta linha, o aviso que este
            // bloco acabou de montar ficaria escondido atrás dela pra sempre
            // (o bundle que a removeria é justamente o que não vai carregar).
            var sp = document.getElementById('splash');
            if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
          } catch (e) {}
        })();
      </script>
      <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .catch(() => {});
          });
        }
      </script>
    </body>
  </html>
