<!doctype html>
<!--
  Página de erro de rede do APK (Capacitor `server.errorPath`).
  O APK carrega o Worker remoto (`server.url`); sem rede o WebView mostraria a
  página de erro do Chrome. O Capacitor, em vez disso, abre ESTE arquivo, que
  vive empacotado no APK (assets/public/offline.html, servido em
  https://localhost/offline.html). Tudo é local: CSS inline, mascote em data-URI
  (src/assets/brand/final/mascote.png), fonte de /fonts. O comportamento mora em
  /offline.js (script externo: a CSP não aceita script inline sem hash).
  Tokens: --sm2-* de docs/manual/04-IDENTIDADE-VISUAL.md §2.8.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08191A" />
    <meta name="robots" content="noindex" />
    <title>Soulmon</title>
    <style>
      @font-face {
        font-family: 'Rubik';
        font-style: normal;
        font-weight: 300 900;
        font-display: swap;
        src: url('/fonts/rubik-latin.woff2') format('woff2');
      }
      :root {
        --sm2-bg: #08191a;
        --sm2-surface: #0f2a29;
        --sm2-line: #1e3f3c;
        --sm2-ink: #e9f5f2;
        --sm2-muted: #9dbcb4;
        --sm2-primary-fill: #5ff3e0;
        --sm2-primary-deep: #29c9b8;
        --sm2-on-primary: #04211f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--sm2-bg); }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        color: var(--sm2-ink);
        font-family: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.55;
      }
      main {
        width: 100%;
        max-width: 26rem;
        text-align: center;
        background: var(--sm2-surface);
        border: 2px solid var(--sm2-line);
        border-radius: 16px;
        padding: 28px 22px 24px;
      }
      .mascote {
        width: 112px;
        height: auto;
        image-rendering: pixelated;
        display: block;
        margin: 0 auto 12px;
        animation: respira 3.2s ease-in-out infinite;
      }
      h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 8px; color: var(--sm2-primary-fill); }
      p { margin: 0 0 12px; }
      .salvo {
        color: var(--sm2-muted);
        font-size: 0.95rem;
        border-top: 1px solid var(--sm2-line);
        padding-top: 14px;
        margin-top: 4px;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        width: 100%;
        min-height: 48px;
        margin: 8px 0 16px;
        padding: 12px 18px;
        border-radius: 12px;
        background: var(--sm2-primary-fill);
        color: var(--sm2-on-primary);
        font: inherit;
        font-weight: 600;
        font-size: 1.05rem;
      }
      button:focus-visible { outline: 3px solid var(--sm2-ink); outline-offset: 3px; }
      button:active { background: var(--sm2-primary-deep); }
      button[disabled] { opacity: 0.7; cursor: progress; }
      @keyframes respira {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mascote { animation: none; }
      }
    </style>
  </head>
