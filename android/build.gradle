// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // EXPLICITLY put the working Bouncy Castle version on the classpath FIRST
        classpath 'org.bouncycastle:bcprov-jdk18on:1.78.1'
        classpath 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
        classpath 'org.bouncycastle:bcutil-jdk18on:1.78.1'
        
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"
    }
    
    // Safety net: Keep resolution strategy
    configurations.classpath {
        resolutionStrategy {
            force 'org.bouncycastle:bcprov-jdk18on:1.78.1'
            force 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
            force 'org.bouncycastle:bcutil-jdk18on:1.78.1'
        }
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Force subprojects to also align (just in case)
    configurations.all {
        resolutionStrategy {
            // Fix 1: Bouncy Castle (Java 21 vs 17 conflict)
            force 'org.bouncycastle:bcprov-jdk18on:1.78.1'
            force 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
            force 'org.bouncycastle:bcutil-jdk18on:1.78.1'

            // Fix 2: Kotlin Duplicate Classes (1.8.22 vs 1.6.21)
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
    }

    // Fix 3: alguns módulos gerados/trazidos pelo `cap sync` (ex.: o próprio
    // node_modules/@capacitor/android, não só o capacitor-cordova-android-plugins
    // que este bloco mirava antes) fixam sourceCompatibility VERSION_21 no PRÓPRIO
    // build.gradle deles — e como esse valor é lido DEPOIS que este bloco roda
    // (plugins.withId dispara na hora que o plugin é aplicado, cedo demais),
    // o valor do módulo ganhava por último e quebrava build em javac < 21.
    // afterEvaluate garante que rodamos por ÚLTIMO, depois de qualquer
    // build.gradle de módulo já ter setado (errado) o próprio compileOptions.
    afterEvaluate { proj ->
        if (proj.hasProperty('android')) {
            proj.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
