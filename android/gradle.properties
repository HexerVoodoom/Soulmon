android.useAndroidX=true
android.enableJetifier=true
# Suppress warning about using compileSdk 35 with older AGP
android.suppressUnsupportedCompileSdk=35
# Build performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Heap do Gradle (07/10/2026): sem `org.gradle.jvmargs` o daemon roda com o
# heap padrao (512 MB) e o `:app:packageDebug` estourou com
# `java.lang.OutOfMemoryError` depois que os assets da web (dist/, ~2,6 mil
# arquivos, mais a musica-tema) engordaram o APK. O runner do GitHub tem 7 GB.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
