apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.hexervoodoom.soulmon"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hexervoodoom.soulmon"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 21/09/2026 (QA geral, etapa 4 — preparo do lançamento na Play):
        // 14/1.1.3 → 15/1.1.4. É o PRIMEIRO bundle que carrega os três pacotes
        // que só valem no aparelho com build novo (docs/STATUS.md §3.2 🟠):
        // WP0.6 `setObfuscatedAccountId` (BillingPlugin.kt), WP5.8 preço
        // localizado vindo da Play, WP2.6 widget com constância/escudos/oferta.
        // A Play recusa AAB com versionCode repetido — bump manual, sem
        // automação no CI (15-superficies-secundarias.md §B "Versão").
        versionCode 15
        versionName "1.1.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        // Kotlin 1.8.22 doesn't recognise JVM target 21; on JDK 21 the plugin
        // would otherwise auto-pick 21 and fail. Pin to 17 (matches Java target).
        jvmTarget = '17'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    // Google Play Billing — compras dentro do app (ver plugins/BillingPlugin.kt).
    // Obrigatório pela Play para conteúdo digital; não dá para usar Stripe/Pix aqui.
    //
    // ⚠️ VERSÃO MÍNIMA EXIGIDA PELA PLAY — [a confirmar no Play Console] antes do
    // primeiro upload de AAB. `docs/reviews/2026-09-21-qa-geral/15-superficies-
    // secundarias.md` §B registra (sem fonte primária no repo) que a Play exige
    // Billing Library ≥ 7 para atualizações desde 31/08/2025 e ≥ 8 a partir de
    // 31/08/2026; com 6.2.1 o upload seria rejeitado na loja, não no build.
    // NÃO foi bumpado aqui de propósito: `BillingPlugin.kt` chama
    // `enablePendingPurchases()` SEM argumento, forma que a 7.x removeu (exige
    // `PendingPurchasesParams`) — subir só esta linha quebra o compile do Kotlin,
    // e o CI é o único lugar que prova o contrário. Roteiro completo em
    // `docs/PLAY-LANCAMENTO.md` §G (Android).
    // Play recusa PBL < 8 em app novo/update desde 31/08/2026
    // (developer.android.com/google/play/billing/deprecation-faq, lido em 21/09/2026).
    // 8.3.0 = última 8.x nas release notes (2025-12-23; 8.1.0 era a citada no
    // relatório 05-plataforma-r1, mas as notes já listam 8.2.0/8.2.1/8.3.0).
    // Conferir no Maven antes do AAB. Guard textual: src/plugins/billingPbl8.contract.test.ts
    implementation "com.android.billingclient:billing-ktx:8.3.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// capacitor.build.gradle (regenerated by `cap sync`) forces Java 21, which
// clashes with Kotlin 1.8.22's max JVM target. Re-pin to 17 AFTER it so the
// app's javac and kotlinc both target 17. javac on JDK 21 can still read the
// Java-21 bytecode of capacitor-android on the classpath, so this is safe.
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// google-services.json existir não basta: se ele vem de outro app do MESMO
// projeto Firebase (compartilhado com o DigiApp, ver CLAUDE.md) sem um
// client pro NOSSO applicationId, o plugin falha o build inteiro em vez de
// só avisar (foi o que quebrou toda build de CI por um bom tempo). Valida
// o conteúdo, não só a existência do arquivo.
try {
    def servicesJSON = file('google-services.json')
    def hasMatchingClient = false
    if (servicesJSON.text) {
        def parsed = new groovy.json.JsonSlurper().parseText(servicesJSON.text)
        hasMatchingClient = parsed.client?.any { c ->
            c.client_info?.android_client_info?.package_name == android.defaultConfig.applicationId
        }
    }
    if (hasMatchingClient) {
        apply plugin: 'com.google.gms.google-services'
    } else {
        logger.warn("google-services.json não tem client pra '${android.defaultConfig.applicationId}' — plugin não aplicado, FCM push não funciona até alguém registrar o app no Firebase Console.")
    }
} catch(Exception e) {
    logger.info("google-services.json não encontrado/inválido, google-services plugin não aplicado. Push Notifications won't work")
}
