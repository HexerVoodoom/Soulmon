name = "digiapp-push-scheduler"
main = "push-scheduler.js"
compatibility_date = "2024-09-23"

# Cron triggers (UTC) — all times are BRT (UTC-3) + 3h
# 10h BRT = 13h UTC, 16h BRT = 19h UTC, 22h BRT = 01h UTC
#
# ⚠️ As horas são derivadas de PUSH_HOURS_BRT em `functions/api/_pushCopy.js`.
# `workers/pushCopy.parity.test.js` trava esta lista contra o módulo — o cron
# das 21h ("0 0 * * *") saiu junto com o nudge das 21h, que a auditoria de tom
# tinha removido só do cliente.
[triggers]
crons = ["0 1 * * *", "0 13 * * *", "0 19 * * *"]

[[kv_namespaces]]
binding = "PUSH_SUBSCRIPTIONS"
id = "12dd88d3282140e786a5b2c5b5b940cf"

[vars]
VAPID_PUBLIC_KEY = "BK2MsJZtN6ancQBtKZYLFxe_avXfIPqRs28szlgRXJGfQcJlrd4wtBhzMr6t2zPvz7HUeJv-jpleDaNfmRZIlXY"
APP_URL = "https://soulmon.mateus-sprnd.workers.dev"

# VAPID_JWK must be set as a secret:
# wrangler secret put VAPID_JWK
# (paste the full JWK JSON when prompted)

# FIREBASE_SERVICE_ACCOUNT must be set as a secret — powers FCM push to the
# native Android app (Firebase Console → Project Settings → Service accounts
# → Generate new private key; paste the FULL downloaded JSON when prompted):
# wrangler secret put FIREBASE_SERVICE_ACCOUNT

# WP4.18 — fechamento automático da season do Torneio (troféus 🥇🥈🥉).
# O cron das 10h BRT do dia 1 chama `POST /api/community?action=closeSeason`
# da season anterior. Sem estes dois o fechamento é PULADO com log, nunca
# tentado às cegas:
#   wrangler secret put SEASON_ADMIN_KEY   # o mesmo valor do Pages
# (APP_URL já vai em [vars] acima.)
